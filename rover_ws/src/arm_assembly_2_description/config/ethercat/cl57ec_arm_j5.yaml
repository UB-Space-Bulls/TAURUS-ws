# CL57EC on arm_j5. ESI: Bohign_MS_ECAT_V2.5.xml (vendor 0x994)
# counts per joint turn = FILL pulses per motor turn x FILL gear ratio = FILL
vendor_id: 0x00000994
product_id: 0x00003000
assign_activate: 0x0300
auto_fault_reset: false
rpdo: # computer -> drive
- index: 0x1600
channels:
- {index: 0x6040, sub_index: 0, type: uint16, default: 0} # control
word
#FILL_RX_FACTOR = 4774.65 counts per radian based on 10000 pulses per motor turn
#FILL_TX_FACTOR = 0.00020944 radians per count
- {index: 0x607a, sub_index: 0, type: int32, command_interface:
position, factor: 4774.65, default: .nan} # target position
- {index: 0x60ff, sub_index: 0, type: int32, default: 0} # target
velocity (unused)
- {index: 0x60b8, sub_index: 0, type: uint16, default: 0} # touch
probe function (unused)
- {index: 0x60fe, sub_index: 1, type: uint32, default: 0} # digital
outputs (unused)
- index: 0x1601
channels:
- {index: 0x6060, sub_index: 0, type: int8, default: 8} # mode 8 =
cyclic position
tpdo: # drive -> computer
- index: 0x1a00
channels:
- {index: 0x603f, sub_index: 0, type: uint16} # error code
- {index: 0x6041, sub_index: 0, type: uint16} # status word
- {index: 0x6064, sub_index: 0, type: int32, state_interface: position,
factor: 0.00020944} # actual position
- {index: 0x60fd, sub_index: 0, type: uint32} # digital inputs
- {index: 0x606c, sub_index: 0, type: int32} # actual velocity
(unused)
- {index: 0x60f4, sub_index: 0, type: int32} # following error
- {index: 0x60b9, sub_index: 0, type: uint16} # touch probe status
- {index: 0x60ba, sub_index: 0, type: int32} # touch probe 1 +

